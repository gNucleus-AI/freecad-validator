name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: lint
        run: ruff check src tests
      - name: import smoke test
        # FreeCAD itself isn't on the GH runner; we still verify the
        # pure-Python surface of the package imports cleanly. Tests
        # that need FreeCAD are marked `needs_freecad` and skipped
        # in CI; they should be run locally before release.
        run: python -c "import freecad_validator; print(freecad_validator.__version__)"
      - name: pytest (FreeCAD-free unit tests only)
        run: pytest -m "not needs_freecad"
