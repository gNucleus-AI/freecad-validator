name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      - name: install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,v2]
      - name: verify v2 backend installation
        run: python -c "from OCP.BRepBndLib import BRepBndLib; assert callable(BRepBndLib.AddOBB_s)"
      - name: lint
        run: ruff check .

      # Formatting is a gate, not a suggestion: an unformatted tree is a
      # noisy diff for the next contributor. `ruff` is pinned to a minor
      # line in the dev extra because format output is version-sensitive —
      # an unpinned upgrade would fail this step on style, not substance.
      - name: format
        run: ruff format --check .
      - name: import smoke test
        # FreeCAD itself isn't on the GH runner; we still verify the
        # pure-Python surface of the package imports cleanly. Tests
        # that need FreeCAD are marked `needs_freecad` and skipped
        # in CI; they should be run locally before release.
        run: python -c "import freecad_validator; print(freecad_validator.__version__)"
      - name: pytest (FreeCAD-free unit tests only)
        run: pytest -m "not needs_freecad"

  wheel-cross-interpreter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host-python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.host-python }}
      - name: install wheel under host Python
        run: |
          python -m pip install --upgrade pip
          pip install .
          echo "FCSTD_ADAPTER_PATH=$(python -c 'from importlib.util import find_spec; from pathlib import Path; spec = find_spec("freecad_validator"); print(Path(next(iter(spec.submodule_search_locations))) / "fem" / "adapters" / "fcstd.py")')" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: execute installed adapter with embedded-Python equivalent
        run: python tests/integration/check_fem_adapter_import.py "$FCSTD_ADAPTER_PATH"
