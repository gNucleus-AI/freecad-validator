[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "gnucleus-freecad-validator"
version = "0.2.0"
description = "Deterministic validation for FreeCAD geometry, design specifications, and solved FreeCAD/CalculiX FEM analyses."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "gNucleus AI" }]
keywords = ["freecad", "cad", "fem", "fea", "calculix", "validator", "benchmark", "spec", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic >= 2.0",
    "numpy >= 1.24",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]
# `render` enables the `freecad-validator render` subcommand
# (rasterize a .FCStd to a PNG). PyVista pulls VTK as a transitive,
# so keep it opt-in — most validator users don't need rendering.
render = [
    "pyvista >= 0.43",
]

[project.urls]
Homepage = "https://github.com/gNucleus-AI/freecad-validator"
Repository = "https://github.com/gNucleus-AI/freecad-validator"
Issues = "https://github.com/gNucleus-AI/freecad-validator/issues"

[project.scripts]
freecad-validator = "freecad_validator.cli.main:main"


[tool.hatch.build.targets.wheel]
packages = ["src/freecad_validator"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "needs_freecad: test requires the FreeCAD Python module to be importable",
    "needs_calculix: test requires FreeCAD and CalculiX",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # let formatter handle long lines


[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true   # FreeCAD has no type stubs
